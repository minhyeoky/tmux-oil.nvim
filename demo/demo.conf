# tmux config for the demo server only.
set -g prefix C-a
set -g base-index 1
set -g renumber-windows on
set -g status-position bottom
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left " #[bold]#S #[nobold]"
set -g status-left-length 20
set -g status-right " %H:%M "
set -g window-status-format " #I #W "
set -g window-status-current-format "#[bg=#fabd2f,fg=#282828,bold] #I #W "
set -g window-status-separator ""
set -g popup-border-style "fg=#665c54"
set -g popup-border-lines rounded
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -s escape-time 0
bind s run-shell "TMUX_OIL_SOCKET=tmux-oil-demo NVIM_APPNAME=tmux-oil-demo $TMUX_OIL_ROOT/bin/tmux-oil-popup"
